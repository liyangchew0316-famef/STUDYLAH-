<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="50%" stop-color="#0A0A0A" />
      <stop offset="100%" stop-color="#020202" />
    </linearGradient>

    <linearGradient id="ogGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="35%" stop-color="#F1D475" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#A68A2D" />
    </linearGradient>

    <linearGradient id="ogBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1D475" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#99771F" stop-opacity="0.6" />
    </linearGradient>

    <radialGradient id="ogCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)" />
  <rect width="1200" height="630" fill="url(#ogCenterGlow)" />
  
  <!-- Outer Decorative Border -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="url(#ogBorder)" stroke-width="2" />
  
  <!-- Top Tag / Pill -->
  <g transform="translate(60, 68)">
    <rect x="0" y="0" width="280" height="42" rx="21" fill="#1A1A1A" stroke="#D4AF37" stroke-width="1.5" />
    <circle cx="24" cy="21" r="6" fill="#D4AF37" />
    <text x="42" y="27" fill="#F1D475" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">KSSM &amp; SPM CURRICULUM</text>
  </g>

  <!-- Main STUDYLAH Typography -->
  <g transform="translate(60, 190)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="78" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
      STUDY<tspan fill="url(#ogGold)">LAH</tspan>
    </text>
  </g>

  <!-- Subtitle / Tagline -->
  <text x="60" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="#E0E0E0">
    Malaysian Secondary School AI Study Companion
  </text>
  
  <text x="60" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#A0A0A0">
    Form 1 – Form 6 • Dual Language (BM &amp; English) • Powered by Gemini AI
  </text>

  <!-- 4 Feature Chips -->
  <g transform="translate(60, 360)">
    <!-- Feature 1: Mindmaps -->
    <g transform="translate(0, 0)">
      <rect width="240" height="74" rx="14" fill="#141414" stroke="#333333" stroke-width="1" />
      <rect width="4" height="74" rx="2" fill="url(#ogGold)" />
      <text x="24" y="34" fill="#FFFFFF" font-family="sans-serif" font-size="17" font-weight="700">AI Mindmaps</text>
      <text x="24" y="56" fill="#888888" font-family="sans-serif" font-size="13">Interactive Visual Nodes</text>
    </g>

    <!-- Feature 2: Quizzes -->
    <g transform="translate(260, 0)">
      <rect width="240" height="74" rx="14" fill="#141414" stroke="#333333" stroke-width="1" />
      <rect width="4" height="74" rx="2" fill="url(#ogGold)" />
      <text x="24" y="34" fill="#FFFFFF" font-family="sans-serif" font-size="17" font-weight="700">SPM Quizzes</text>
      <text x="24" y="56" fill="#888888" font-family="sans-serif" font-size="13">Instant Step Explanations</text>
    </g>

    <!-- Feature 3: Flashcards -->
    <g transform="translate(520, 0)">
      <rect width="240" height="74" rx="14" fill="#141414" stroke="#333333" stroke-width="1" />
      <rect width="4" height="74" rx="2" fill="url(#ogGold)" />
      <text x="24" y="34" fill="#FFFFFF" font-family="sans-serif" font-size="17" font-weight="700">Smart Flashcards</text>
      <text x="24" y="56" fill="#888888" font-family="sans-serif" font-size="13">3D Flip Active Recall</text>
    </g>

    <!-- Feature 4: Bijak AI -->
    <g transform="translate(780, 0)">
      <rect width="240" height="74" rx="14" fill="#141414" stroke="#333333" stroke-width="1" />
      <rect width="4" height="74" rx="2" fill="url(#ogGold)" />
      <text x="24" y="34" fill="#FFFFFF" font-family="sans-serif" font-size="17" font-weight="700">Bijak AI Tutor</text>
      <text x="24" y="56" fill="#888888" font-family="sans-serif" font-size="13">24/7 Bilingual Study Buddy</text>
    </g>
  </g>

  <!-- Big Embellished Logo Emblem on Right -->
  <g transform="translate(860, 80) scale(0.68)">
    <circle cx="256" cy="240" r="180" fill="#D4AF37" opacity="0.12" />
    <polygon points="256,120 404,188 256,256 108,188" fill="url(#ogGold)" />
    <path d="M 166,220 L 166,284 C 166,328 346,328 346,284 L 346,220 C 316,242 284,252 256,252 C 228,252 196,242 166,220 Z" fill="url(#ogGold)" opacity="0.95" />
    <ellipse cx="256" cy="188" rx="14" ry="7" fill="#FFFFFF" />
    <path d="M 256,188 Q 370,195 388,270" fill="none" stroke="url(#ogGold)" stroke-width="7" stroke-linecap="round" />
    <polygon points="383,270 395,270 400,314 378,314" fill="url(#ogGold)" />
    
    <g transform="translate(0, 16)">
      <path d="M 256,366 C 220,344 168,344 126,356 L 126,410 C 168,398 220,398 256,420 Z" fill="url(#ogGold)" />
      <path d="M 256,366 C 292,344 344,344 386,356 L 386,410 C 344,398 292,398 256,420 Z" fill="url(#ogGold)" />
      <line x1="256" y1="366" x2="256" y2="422" stroke="#141414" stroke-width="4" stroke-linecap="round" />
    </g>
  </g>

  <!-- Bottom Bar: Malaysian Curriculum Badge & Tech Stack -->
  <g transform="translate(60, 520)">
    <text x="0" y="0" fill="#666666" font-family="sans-serif" font-size="14" font-weight="500">
      MALAYSIA NATIONAL CURRICULUM (KSSM / KBSM / SPM / STPM) • KEMENTERIAN PENDIDIKAN MALAYSIA SYLLABUS
    </text>
  </g>
</svg>
