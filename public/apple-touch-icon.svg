<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="appleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A" />
      <stop offset="50%" stop-color="#0E0E0E" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    
    <linearGradient id="goldApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="35%" stop-color="#F1D475" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#99771F" />
    </linearGradient>

    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1D475" />
      <stop offset="100%" stop-color="#99771F" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#appleBg)" />
  <rect x="20" y="20" width="472" height="472" rx="90" fill="none" stroke="url(#goldRing)" stroke-width="8" opacity="0.6" />

  <!-- Mortarboard -->
  <g transform="translate(0, 8)">
    <polygon points="256,125 400,192 256,258 112,192" fill="url(#goldApple)" />
    <path d="M 168,222 L 168,282 C 168,324 344,324 344,282 L 344,222 C 314,244 284,254 256,254 C 228,254 198,244 168,222 Z" fill="url(#goldApple)" opacity="0.92" />
    <ellipse cx="256" cy="192" rx="14" ry="7" fill="#FFFFFF" opacity="0.9" />
    <path d="M 256,192 Q 365,198 385,270" fill="none" stroke="url(#goldApple)" stroke-width="7" stroke-linecap="round" />
    <polygon points="380,270 392,270 397,312 375,312" fill="url(#goldApple)" />
  </g>

  <!-- Open Book Base -->
  <g transform="translate(0, 16)">
    <path d="M 256,364 C 220,342 168,342 128,354 L 128,406 C 168,394 220,394 256,416 Z" fill="url(#goldApple)" />
    <path d="M 256,364 C 292,342 344,342 384,354 L 384,406 C 344,394 292,394 256,416 Z" fill="url(#goldApple)" />
    <line x1="256" y1="364" x2="256" y2="418" stroke="#121212" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>
