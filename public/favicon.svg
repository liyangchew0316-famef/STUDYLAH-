<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07203F" />
      <stop offset="60%" stop-color="#02000D" />
      <stop offset="100%" stop-color="#02000D" />
    </linearGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBDED4" />
      <stop offset="40%" stop-color="#D9AA90" />
      <stop offset="85%" stop-color="#A65E46" />
      <stop offset="100%" stop-color="#80422F" />
    </linearGradient>

    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9AA90" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#A65E46" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#D9AA90" stop-opacity="0.8" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="8" />

  <!-- Inner Subtle Ambient Glow -->
  <circle cx="256" cy="240" r="160" fill="#A65E46" opacity="0.12" filter="url(#goldGlow)" />

  <!-- Main Graduation Cap & Education Motif -->
  <g filter="url(#goldGlow)" transform="translate(0, 4)">
    <!-- Mortarboard top diamond -->
    <polygon points="256,120 404,188 256,256 108,188" fill="url(#goldGrad)" />
    
    <!-- Mortarboard cap skull base -->
    <path d="M 166,220 L 166,284 C 166,328 346,328 346,284 L 346,220 C 316,242 284,252 256,252 C 228,252 196,242 166,220 Z" fill="url(#goldGrad)" opacity="0.9" />

    <!-- Cap Button on top -->
    <ellipse cx="256" cy="188" rx="14" ry="7" fill="#FFF8DC" />

    <!-- Tassel string and ribbon -->
    <path d="M 256,188 Q 370,195 388,270" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" />
    <!-- Tassel hanging fringe -->
    <polygon points="383,270 395,270 400,314 378,314" fill="url(#goldGrad)" />
  </g>

  <!-- Open Book Base in Gold -->
  <g transform="translate(0, 16)">
    <!-- Left Page -->
    <path d="M 256,366 C 220,344 168,344 126,356 L 126,410 C 168,398 220,398 256,420 Z" fill="url(#goldGrad)" opacity="0.95" />
    <!-- Right Page -->
    <path d="M 256,366 C 292,344 344,344 386,356 L 386,410 C 344,398 292,398 256,420 Z" fill="url(#goldGrad)" opacity="0.95" />
    <!-- Book Center spine line -->
    <line x1="256" y1="366" x2="256" y2="422" stroke="#141414" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- 14-pointed Malaysian Bintang / Sparkle in Center Book -->
  <path d="M 256,328 L 260,338 L 271,338 L 262,344 L 265,354 L 256,348 L 247,354 L 250,344 L 241,338 L 252,338 Z" fill="#FFFFFF" opacity="0.9" />
</svg>
